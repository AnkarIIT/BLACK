<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' qrc:; script-src 'self' 'unsafe-inline' qrc:; connect-src 'self' qrc: http://127.0.0.1:* http://localhost:*; img-src 'self' data: qrc:; style-src 'self' 'unsafe-inline' qrc:; font-src 'self' data: qrc:; frame-src 'self' qrc:; object-src 'none'; base-uri 'self'">
    <title>Favourites</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --sec: #6e6e73;
            --accent: #0066cc;
            --border: rgba(0, 0, 0, 0.08);
            --hover: rgba(0, 0, 0, 0.05);
        }

        html.black-forced-dark {
            color-scheme: dark;
            --bg: #1c1c1e;
            --card: #2c2c2e;
            --text: #f5f5f7;
            --sec: #98989d;
            --accent: #0a84ff;
            --border: rgba(255, 255, 255, 0.1);
            --hover: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px;
            -webkit-font-smoothing: antialiased;
        }

        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .sub { color: var(--sec); font-size: 13px; margin-bottom: 20px; }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .row:hover { background: var(--hover); }
        .row .star { font-size: 15px; color: var(--accent); flex: none; }
        .row .meta { flex: 1; min-width: 0; }
        .row .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .url { font-size: 12px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .remove {
            flex: none;
            border: none;
            background: transparent;
            color: var(--sec);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            visibility: hidden;
        }
        .row:hover .remove { visibility: visible; }
        .row .remove:hover { color: #ff3b30; background: var(--hover); }

        .empty {
            text-align: center;
            color: var(--sec);
            padding: 80px 20px;
            font-size: 14px;
            line-height: 1.8;
        }
        kbd {
            background: var(--hover);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 12px;
            font-family: inherit;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            h1 { font-size: 20px; }
            .sub { font-size: 12px; margin-bottom: 16px; }
            .row {
                padding: 12px 12px;
                gap: 10px;
            }
            .row .title { font-size: 13px; }
            .row .url { font-size: 11px; }
            .row .remove {
                visibility: visible;
                opacity: 0.6;
            }
            .row .remove:hover { opacity: 1; }
            .empty {
                padding: 40px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            h1 { font-size: 18px; }
            .sub { font-size: 11px; }
            .row {
                padding: 10px 10px;
                flex-wrap: wrap;
            }
            .row .star { font-size: 14px; }
            .row .meta { width: calc(100% - 28px); }
            .row .title { font-size: 12px; }
            .row .url { font-size: 10px; }
            .row .remove {
                width: 28px;
                height: 28px;
                padding: 0;
                margin-left: auto;
            }
            .empty {
                padding: 32px 12px;
                font-size: 12px;
            }
        }

        /* Touch device adjustments */
        @media (pointer: coarse) {
            .row {
                min-height: 48px;
            }
            .row .remove {
                min-width: 44px;
                min-height: 44px;
                visibility: visible;
                opacity: 0.5;
            }
        }
    </style>
    <link rel="stylesheet" href="chrome-theme.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <h1>Favourites</h1>
    <div class="sub" id="count"></div>
    <div id="list"></div>

    <script>
        let store = null;

        function hostOf(url) {
            try { return new URL(url).host; } catch (e) { return url; }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function render() {
            const list = document.getElementById('list');
            const count = document.getElementById('count');
            if (!store) return;
            let items = [];
            try { items = JSON.parse(store.json); } catch (e) {}
            count.textContent = items.length + (items.length === 1 ? ' bookmark' : ' bookmarks');
            if (!items.length) {
                list.innerHTML = '<div class="empty">No Favourites yet.<br>Press <kbd>Ctrl+D</kbd> on any page to add it here.</div>';
                return;
            }
            let html = '';
            items.forEach(function (item) {
                const url = escapeHtml(item.url);
                const title = escapeHtml(item.title || hostOf(item.url));
                const host = escapeHtml(hostOf(item.url));
                html += '<div class="row" data-url="' + url + '">' +
                    '<span class="star">★</span>' +
                    '<div class="meta"><div class="title">' + title + '</div>' +
                    '<div class="url">' + host + '</div></div>' +
                    '<button class="remove" title="Remove">✕</button></div>';
            });
            list.innerHTML = html;
            list.querySelectorAll('.row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.classList.contains('remove')) {
                        store.remove(row.dataset.url);
                        return;
                    }
                    var url = row.dataset.url;
                    try {
                        var u = new URL(url);
                        if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
                    } catch (e) {
                        return;
                    }
                    window.location.href = url;
                });
            });
        }

        if (typeof QWebChannel !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                store = channel.objects.bookmarks;
                store.changed.connect(render);
                render();

                const theme = channel.objects.theme;
                const applyTheme = function () {
                    const el = document.documentElement;
                    const dark = (theme.themeScheme === 1);
                    el.classList.toggle('black-forced-dark', dark);
                    el.classList.toggle('black-forced-light', !dark);
                };
                theme.themeSchemeChanged.connect(applyTheme);
                applyTheme();
            });
        }
    </script>
</body>
</html>
