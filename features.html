<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Features</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        :root {
            --bg-window: #f5f5f7;
            --bg-card: #ffffff;
            --accent: #0066cc;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border: rgba(0,0,0,0.08);
            --hairline: rgba(0,0,0,0.06);
            --control-bg: rgba(0,0,0,0.05);
            --radius: 12px;
        }

        html.black-forced-dark {
            color-scheme: dark;
            --bg-window: #1e1e20;
            --bg-card: #2c2c2e;
            --accent: #0a84ff;
            --text-primary: #f5f5f7;
            --text-secondary: #98989d;
            --border: rgba(255,255,255,0.12);
            --hairline: rgba(255,255,255,0.09);
            --control-bg: rgba(255,255,255,0.08);
        }

        html.black-forced-light { color-scheme: light; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
            background-color: var(--bg-window);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 32px 60px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .page-sub {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .group {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
        }

        .row + .row { border-top: 1px solid var(--hairline); }

        .feat-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--control-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .feat-name { font-size: 14px; font-weight: 600; }

        .feat-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        .feat-text { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Features</h1>
        <p class="page-sub">Experimental features for developers and power users.</p>
        <div class="group">
            <div class="row">
                <div class="feat-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
                <div class="feat-text">
                    <div class="feat-name">Web Developer Tools</div>
                    <div class="feat-desc">Inspect pages, view console output and debug web content.</div>
                </div>
            </div>
            <div class="row">
                <div class="feat-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
                <div class="feat-text">
                    <div class="feat-name">Tracker Blocking</div>
                    <div class="feat-desc">BLACK prevents trackers from profiling you across the web.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (typeof QWebChannel !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                const theme = channel.objects.theme;
                const applyTheme = function () {
                    const el = document.documentElement;
                    const dark = (theme.themeScheme === 1);
                    el.classList.toggle('black-forced-dark', dark);
                    el.classList.toggle('black-forced-light', !dark);
                };
                theme.themeSchemeChanged.connect(applyTheme);
                applyTheme();
            });
        }
    </script>
</body>
</html>
