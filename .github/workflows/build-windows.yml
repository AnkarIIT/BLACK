name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aqt (Qt CLI installer)
        run: |
          pip install aqtinstall

      - name: Install Qt 6.7.2 (MSVC 2022 64-bit) with WebEngine + SVG
        run: |
          aqt install-qt windows desktop 6.7.2 win64_msvc2022_64 -m qtwebengine qtsvg -O C:/Qt

      - name: Set Qt environment
        run: |
          echo "QT_ROOT=C:/Qt/6.7.2/msvc2022_64" >> $env:GITHUB_ENV
          echo "C:/Qt/6.7.2/msvc2022_64/bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT" -G "Visual Studio 17 2022" -A x64
        shell: cmd

      - name: Build
        run: |
          cmake --build build --config Release --parallel
        shell: cmd

      - name: Verify executable
        run: |
          dir build\Release\BLACK.exe
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-windows
          path: build/Release/BLACK.exe
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/BLACK.exe
          generate_release_notes: true