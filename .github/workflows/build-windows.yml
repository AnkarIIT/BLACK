name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 via Chocolatey (MSVC 2022 64-bit)
        run: |
          choco install qt6 --version=6.7.2 -y --params "/target:msvc2022_64"
        shell: pwsh

      - name: Set Qt environment
        run: |
          $qtPaths = @(
            "C:/Program Files/Qt/6.7.2/msvc2022_64",
            "C:/Qt/6.7.2/msvc2022_64",
            "C:/Program Files/Qt/6.7.1/msvc2022_64",
            "C:/Qt/6.7.1/msvc2022_64"
          )
          foreach ($p in $qtPaths) {
            if (Test-Path "$p/bin/qmake.exe") {
              echo "QT_ROOT=$p" >> $env:GITHUB_ENV
              echo "$p/bin" >> $env:GITHUB_PATH
              Write-Host "Found Qt at $p"
              break
            }
          }
          if (-not $env:QT_ROOT) {
            Write-Error "Qt not found in standard locations"
            exit 1
          }
        shell: pwsh

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT" -G "Visual Studio 17 2022" -A x64
        shell: cmd

      - name: Build
        run: |
          cmake --build build --config Release --parallel
        shell: cmd

      - name: Verify executable
        run: |
          dir build\Release\BLACK.exe
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-windows
          path: build/Release/BLACK.exe
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/BLACK.exe
          generate_release_notes: true