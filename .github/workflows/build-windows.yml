name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pre-built Qt 6.7.2 (MSVC 2022 64-bit) from GitHub
        run: |
          $qtDir = "C:/Qt/6.7.2/msvc2022_64"
          $qtUrl = "https://github.com/qtproject/qtbase/releases/download/v6.7.2/qtbase-everywhere-src-6.7.2.zip"
          # Use a known working mirror: GitHub's own Qt mirror
          $altUrl = "https://github.com/benlau/qtci/raw/master/qt-6.7.2-msvc2022_64.7z"
          
          Write-Host "Downloading Qt from GitHub mirror..."
          try {
            Invoke-WebRequest -Uri $altUrl -OutFile "qt.7z" -ErrorAction Stop
          } catch {
            Write-Warning "Mirror failed, trying official..."
            Invoke-WebRequest -Uri "https://download.qt.io/official_releases/qt/6.7/6.7.2/qt-6.7.2-windows-x86_64-msvc2022_64.7z" -OutFile "qt.7z"
          }
          
          Write-Host "Extracting..."
          7z x qt.7z -o"$qtDir" -y
          Write-Host "Qt extracted to $qtDir"
          
          # Verify qmake exists
          if (-not (Test-Path "$qtDir/bin/qmake.exe")) {
            Write-Error "qmake not found at $qtDir/bin/qmake.exe"
            exit 1
          }
        shell: pwsh

      - name: Set Qt environment
        run: |
          echo "QT_ROOT=C:/Qt/6.7.2/msvc2022_64" >> $env:GITHUB_ENV
          echo "C:/Qt/6.7.2/msvc2022_64/bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT" -G "Visual Studio 17 2022" -A x64
        shell: cmd

      - name: Build
        run: |
          cmake --build build --config Release --parallel
        shell: cmd

      - name: Verify executable
        run: |
          dir build\Release\BLACK.exe
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-windows
          path: build/Release/BLACK.exe
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/BLACK.exe
          generate_release_notes: true