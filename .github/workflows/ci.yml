name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    
    strategy:
      matrix:
        qt_version: [6.8.3]
        build_type: [Release, Debug]
        
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ matrix.qt_version }}
        host: mac
        target: desktop
        arch: clang_64
        modules: qtwebengine qtwebchannel qtpositioning
        cache: false
        
    - name: Install Dependencies
      run: |
        brew install openssl llvm
        
    - name: Configure CMake
      run: |
        CMAKE_ARGS="-S . -B build -DCMAKE_PREFIX_PATH=/Users/runner/Qt/${{ matrix.qt_version }}/macos"
        if [ "${{ matrix.build_type }}" = "ASAN" ]; then
          CMAKE_ARGS="$CMAKE_ARGS -DENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug"
        elif [ "${{ matrix.build_type }}" = "UBSAN" ]; then
          CMAKE_ARGS="$CMAKE_ARGS -DENABLE_UBSAN=ON -DCMAKE_BUILD_TYPE=Debug"
        else
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}"
        fi
        cmake $CMAKE_ARGS
        
    - name: Build
      run: |
        cmake --build build --parallel $(sysctl -n hw.ncpu)

    - name: Dump link command on failure
      if: failure()
      run: |
        cat build/CMakeFiles/BLACK.dir/link.txt || true
        
    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure
        
    - name: Create App Bundle
      if: matrix.build_type == 'Release'
      run: |
        cd build
        macdeployqt BLACK.app
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: black-macos-${{ matrix.qt_version }}-${{ matrix.build_type }}
        path: |
          build/BLACK.app
        retention-days: 7

  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # These tests exercise the browser's HTML/CSS/JS front-end in plain
    # Chromium served by tests/playwright/serve.mjs. They deliberately do not
    # touch the Qt shell: Playwright cannot automate QtWebEngine, only its own
    # bundled browser. So no Qt install and no build are required here.
    steps:
    - uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: tests/playwright/package-lock.json
    - name: Install dependencies
      working-directory: tests/playwright
      run: npm ci
    - name: Install Playwright browsers
      working-directory: tests/playwright
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      working-directory: tests/playwright
      run: npx playwright test
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tests/playwright/playwright-report/
        retention-days: 7

  # Linux and Windows builds are temporarily disabled due to infrastructure issues:
  # - Linux: Qt 6.8 packages not available via aqt on noble (Ubuntu 24.04)
  # - Windows: CMake Visual Studio generator issues on hosted runners
  # These will be re-enabled once the infrastructure is fixed.
  # build-linux:
  #   ...
  # build-windows:
  #   ...

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglib2.0-dev libnss3-dev libatk-bridge2.0-dev libdrm-dev libxkbcommon-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxrandr-dev libgbm-dev libasound2-dev libpulse-dev libsecret-1-dev libssl-dev xvfb
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.8.3
        host: linux
        target: desktop
        arch: gcc_64
        modules: qtwebengine qtwebchannel qtpositioning
        cache: false
    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/../Qt/6.8.3/gcc_64" -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --parallel $(nproc)
    - name: Run Tests
      env:
        QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
      run: xvfb-run -a ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtwebengine qtwebchannel qtpositioning
        cache: false
    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/../Qt/6.8.3/msvc2022_64" -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
    - name: Run Tests
      run: ctest --test-dir build --output-on-failure -C Release