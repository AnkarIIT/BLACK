<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' qrc:; script-src 'self' 'unsafe-inline' qrc:; connect-src 'self' qrc: http://127.0.0.1:* http://localhost:*; img-src 'self' data: qrc:; style-src 'self' 'unsafe-inline' qrc:; font-src 'self' data: qrc:; frame-src 'self' qrc:; object-src 'none'; base-uri 'self'">
    <title>History</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --sec: #6e6e73;
            --accent: #0066cc;
            --border: rgba(0, 0, 0, 0.08);
            --hover: rgba(0, 0, 0, 0.05);
        }

        html.black-forced-dark {
            color-scheme: dark;
            --bg: #1c1c1e;
            --card: #2c2c2e;
            --text: #f5f5f7;
            --sec: #98989d;
            --accent: #0a84ff;
            --border: rgba(255, 255, 255, 0.1);
            --hover: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px;
            -webkit-font-smoothing: antialiased;
        }

        .header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
        h1 { font-size: 22px; font-weight: 700; }
        .sub { color: var(--sec); font-size: 13px; margin-bottom: 20px; }

        #clearBtn {
            border: 1px solid var(--border);
            background: var(--card);
            color: #ff3b30;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #clearBtn:hover { background: var(--hover); }

        .day {
            font-size: 13px;
            font-weight: 600;
            color: var(--sec);
            margin: 18px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .row:hover { background: var(--hover); }
        .row .clock { font-size: 12px; color: var(--sec); flex: none; width: 46px; }
        .row .meta { flex: 1; min-width: 0; }
        .row .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .url { font-size: 12px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .remove {
            flex: none;
            border: none;
            background: transparent;
            color: var(--sec);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            visibility: hidden;
        }
        .row:hover .remove { visibility: visible; }
        .row .remove:hover { color: #ff3b30; background: var(--hover); }

        .empty {
            text-align: center;
            color: var(--sec);
            padding: 80px 20px;
            font-size: 14px;
        }

        /* Dark glassmorphism confirm modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
            padding: 22px 24px;
            width: min(360px, 84vw);
            color: var(--text);
        }
        .modal-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .modal-card p { font-size: 13px; color: var(--sec); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button {
            font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; border: 1px solid var(--border); background: var(--hover);
            color: var(--text);
        }
        .modal-actions button:hover { background: rgba(0, 0, 0, 0.1); }
        html.black-forced-dark .modal-actions button:hover { background: rgba(255, 255, 255, 0.12); }
        .modal-actions .btn-danger {
            background: #ff3b30; border-color: #ff3b30; color: #fff;
        }
        .modal-actions .btn-danger:hover { background: #ff453a; }
    </style>
    <link rel="stylesheet" href="chrome-theme.css">
</head>
<body>
    <div class="header">
        <h1>History</h1>
        <span class="sub" id="count"></span>
    </div>
    <button id="clearBtn">Clear History&hellip;</button>
    <div id="list"></div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card" role="dialog" aria-modal="true">
            <h3>Clear History</h3>
            <p>Are you sure you want to clear all browsing history? This cannot be undone.</p>
            <div class="modal-actions">
                <button id="confirmCancel">Cancel</button>
                <button class="btn-danger" id="confirmOk">Clear All</button>
            </div>
        </div>
    </div>

    <script>
        let store = null;

        function hostOf(url) {
            try { return new URL(url).host; } catch (e) { return url; }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function dateLabel(iso) {
            const d = new Date(iso);
            if (isNaN(d.getTime())) return 'Unknown';
            const now = new Date();
            const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const diff = Math.round((startToday - startDay) / 86400000);
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Yesterday';
            if (diff < 7) return 'Earlier this week';
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function timeLabel(iso) {
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function render() {
            const list = document.getElementById('list');
            const count = document.getElementById('count');
            if (!store) return;
            let items = [];
            try { items = JSON.parse(store.json); } catch (e) {}
            count.textContent = items.length + (items.length === 1 ? ' entry' : ' entries');
            if (!items.length) {
                list.innerHTML = '<div class="empty">No browsing history.</div>';
                return;
            }
            let html = '';
            let lastDay = '';
            items.forEach(function (item) {
                const day = dateLabel(item.timestamp);
                if (day !== lastDay) {
                    html += '<div class="day">' + escapeHtml(day) + '</div>';
                    lastDay = day;
                }
                const url = escapeHtml(item.url);
                const title = escapeHtml(item.title || hostOf(item.url));
                const host = escapeHtml(hostOf(item.url));
                const time = escapeHtml(timeLabel(item.timestamp));
                html += '<div class="row" data-url="' + url + '">' +
                    '<span class="clock">' + time + '</span>' +
                    '<div class="meta"><div class="title">' + title + '</div>' +
                    '<div class="url">' + host + '</div></div>' +
                    '<button class="remove" title="Remove">✕</button></div>';
            });
            list.innerHTML = html;
            list.querySelectorAll('.row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.classList.contains('remove')) {
                        store.remove(row.dataset.url);
                        return;
                    }
                    window.location.href = row.dataset.url;
                });
            });
        }

        if (typeof QWebChannel !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                store = channel.objects.history;
                store.changed.connect(render);
                render();

                document.getElementById('clearBtn').addEventListener('click', function () {
                    document.getElementById('confirmModal').classList.add('show');
                });
                document.getElementById('confirmCancel').addEventListener('click', function () {
                    document.getElementById('confirmModal').classList.remove('show');
                });
                document.getElementById('confirmOk').addEventListener('click', function () {
                    document.getElementById('confirmModal').classList.remove('show');
                    store.clearAll();
                });
                const closeModal = function () {
                    document.getElementById('confirmModal').classList.remove('show');
                };
                document.getElementById('confirmModal').addEventListener('click', function (e) {
                    if (e.target === this) closeModal();
                });
                window.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeModal();
                });

                const theme = channel.objects.theme;
                const applyTheme = function () {
                    const el = document.documentElement;
                    const dark = (theme.themeScheme === 1);
                    el.classList.toggle('black-forced-dark', dark);
                    el.classList.toggle('black-forced-light', !dark);
                };
                theme.themeSchemeChanged.connect(applyTheme);
                applyTheme();
            });
        }
    </script>
</body>
</html>
