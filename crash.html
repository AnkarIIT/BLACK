<!DOCTYPE html>
<html lang="en" data-ui-layout="safari">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Crashed</title>
<link rel="stylesheet" href="qrc:/chrome-theme.css">
<style>
  :root {
    --bg-window: #f5f5f7;
    --bg-card: #ffffff;
    --accent: #0066cc;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --border: rgba(0,0,0,0.08);
    --hairline: rgba(0,0,0,0.06);
    --danger: #d70015;
  }
  html.black-forced-dark {
    color-scheme: dark;
    --bg-window: #1e1e20;
    --bg-card: #2c2c2e;
    --accent: #0a84ff;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --border: rgba(255,255,255,0.12);
    --hairline: rgba(255,255,255,0.09);
    --danger: #ff453a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-window);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(560px, 100%);
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 34px 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.12), 0 2px 8px var(--hairline);
  }
  .crash-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 18px;
    background: var(--hairline);
  }
  h1 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  p { color: var(--text-secondary); font-size: 14px; line-height: 1.55; }
  .url {
    color: var(--text-secondary);
    font-size: 12.5px;
    word-break: break-all;
    padding: 10px 12px;
    margin: 12px 0 20px;
    background: var(--hairline);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: var(--text-primary);
    background: var(--hairline);
    transition: filter 0.15s ease;
  }
  button.primary { background: var(--accent); color: #ffffff; border-color: transparent; }
  button.danger { color: var(--danger); }
  button:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <div class="card">
    <div class="crash-icon">💥</div>
    <h1>This page has crashed</h1>
    <p>The renderer process for this tab stopped unexpectedly. You can try reloading the page, copy its address, or head back to your start page.</p>
    <div class="url" id="url">—</div>
    <div class="actions">
      <button class="primary" id="reload">Reload page</button>
      <button id="copy">Copy URL</button>
      <button class="danger" id="close">Go to start page</button>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    (function () {
      // The native side percent-encodes the original url into ?url=; URLSearchParams
      // already decodes it once, so no extra decodeURIComponent here.
      var raw = new URLSearchParams(location.search).get('url');
      var url = raw ? raw : '';
      var urlEl = document.getElementById('url');
      if (urlEl) urlEl.textContent = url || '—';

      document.getElementById('reload').addEventListener('click', function () {
        if (url) location.href = url;
        else location.href = 'qrc:/startpage_enhanced.html';
      });
      document.getElementById('copy').addEventListener('click', function () {
        if (url && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url);
        }
      });
      document.getElementById('close').addEventListener('click', function () {
        location.href = 'qrc:/startpage_enhanced.html';
      });
    })();
  </script>
</body>
</html>
