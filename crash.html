<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Crashed</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --border: rgba(0,0,0,0.08);
            --card: #ffffff;
        }
        html.black-forced-dark {
            --bg: #1e1e20;
            --text: #f5f5f7;
            --text-secondary: #98989d;
            --accent: #0a84ff;
            --border: rgba(255,255,255,0.12);
            --card: #2c2c2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 40px; height: 40px; fill: white; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        p { color: var(--text-secondary); font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
        .url-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            margin-left: 12px;
        }
        .btn-secondary:hover { border-color: var(--accent); }
        .details {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: left;
        }
        .details summary {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .details pre {
            margin-top: 12px;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 11px;
            overflow: auto;
            max-height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>
        <h1>Page Crashed</h1>
        <p id="message">Something went wrong while displaying this page.</p>
        <div class="url-box" id="urlBox"></div>
        <button class="btn btn-primary" id="reloadBtn">Reload Page</button>
        <button class="btn btn-secondary" id="homeBtn">Go to Start Page</button>
        <details class="details">
            <summary>Technical Details</summary>
            <pre id="detailsPre">Renderer process crashed. This can happen due to:
- Insufficient memory
- Graphics driver issues
- Problematic page content
- Browser extension conflicts</pre>
        </details>
    </div>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const crashedUrl = urlParams.get('url') || 'unknown';
            const crashCount = parseInt(urlParams.get('count') || '0', 10);
            
            const urlBox = document.getElementById('urlBox');
            const message = document.getElementById('message');
            const detailsPre = document.getElementById('detailsPre');
            
            urlBox.textContent = decodeURIComponent(crashedUrl);
            
            if (crashCount > 1) {
                message.textContent = `This page has crashed ${crashCount} times. The content may be incompatible or causing instability.`;
            }
            
            detailsPre.textContent = `Crashed URL: ${decodeURIComponent(crashedUrl)}
Crash count: ${crashCount}
Time: ${new Date().toISOString()}
User Agent: ${navigator.userAgent}`;

            document.getElementById('reloadBtn').addEventListener('click', function() {
                window.location.href = decodeURIComponent(crashedUrl);
            });
            
            document.getElementById('homeBtn').addEventListener('click', function() {
                window.location.href = 'qrc:/startpage_enhanced.html';
            });
        })();
    </script>
</body>
</html>
